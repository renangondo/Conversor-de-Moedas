<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo" src="imagens/logo.gif" alt="Logo do Conversor de Moedas">

    <main>
        <label">
            Converter <b>de</b>
            <select class="converted-to-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US& Dolar</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Símbolo do Bitcoin</option>
            </select>
        </label>

            <label">
                Converter <b>para</b>
                <select class="currency-select">
                    <option value="dolar">US$ Dólar Americano</option>
                    <option value="euro">€ Euro</option>
                    <option value="libra">£ Libra Esterlina</option>
                    <option value="bitcoin">₿ Símbolo do Bitcoin</option>
                </select>
            </label>

        <label>
            Valor:
            <input class="input-currency" placeholder="10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="icone" src="imagens/real.png" alt="Ícone do Real Brasileiro">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow" src="imagens/seta.png" alt="Imagem da seta.">

            <div class="currency-box">
                <img class="icone-dolar" src="imagens/dolar.png" alt="Ícone do Dólar Americano">
                <p class="currency" id="currency-name">Dólar</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>
</body>
<script src="scripts.js"></script>

</html>
